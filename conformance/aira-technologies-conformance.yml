domain_standards:
  note: >-
    Aira Technologies sells into telecommunications, a market with real domain standards — O-RAN
    (A1/E2/O1/R1 interfaces), 3GPP, and the TM Forum Open API suite. Aira's press material states
    membership in the O-RAN Alliance, the AI-RAN Alliance and TM Forum, and describes RANGPT
    communicating with an SMO over the R1 interface and with the RAN over O1. NONE of that is a
    contract we can read. The domain-standard check reads the CONTRACT, not a prose claim, and
    there is no Aira-published spec, schema, message type, URN or $metadata surface to inspect —
    no TM Forum Open API resource shape, no O-RAN YANG model, no xApp descriptor. This slot is
    therefore recorded as unevaluated rather than conformant or non-conformant. The check is
    reward-only, so an unevaluated slot costs Aira nothing; it is recorded so a later pass knows
    the lead was chased and why it stopped.
  candidates_checked:
  - standard: TM Forum Open API
    contract_evidence: none
    note: Membership and a 2026 TM Forum Catalyst award are claimed in press releases; no TMF6xx resource shape, schema or conformance profile is published by Aira.
  - standard: 'O-RAN Alliance (A1 / E2 / O1 / R1)'
    contract_evidence: none
    note: Described in press releases about RANGPT and the channel-estimation xApp; no YANG model, xApp descriptor or interface spec is published by Aira.
  - standard: 3GPP
    contract_evidence: none

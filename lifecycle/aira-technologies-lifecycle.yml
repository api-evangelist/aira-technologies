  most_recent_article: '2023-09-26'
  most_recent_event: '2026-02-26'
  detail: >-
    Read live from the collections on 2026-09-14. The news archive is actively maintained; the
    `article` custom post type has not been added to since September 2023 and reads as a retired
    content stream that is still served.

aid: aira-technologies
name: Aira Technologies
description: >-
  Aira Technologies is an AI-defined networking company founded in 2019 and headquartered in
  Saratoga, California, building machine-learning and generative-AI software for mobile network
  operators. Its platform, Naavik, is marketed as an Adaptive Intelligence Framework for the Radio
  Access Network, combining an Intent Manager that turns natural language into network actions,
  AppGen for no-code telecom application generation, a reasoning agent for anomaly detection and
  root-cause analysis, a telecom-specific AI/ML hub and a knowledge graph. Earlier work includes
  RANGPT, a GenAI utility for RAN observability, analysis, control and automation demonstrated with
  Broadcom and Tech Mahindra, and an AI-based channel estimation and prediction xApp. The company
  is a member of the O-RAN Alliance, the AI-RAN Alliance and TM Forum, and raised a $14.5M Series B
  from AT&T Ventures, Intel Capital and In-Q-Tel. Aira sells to operators through a demo and
  sales motion and publishes no developer program, no API documentation, no SDKs and no public
  specification for Naavik or RANGPT. The only machine-readable interface reachable at
  aira-technology.com is the WordPress REST content API behind the corporate website, captured here
  for discovery purposes; it is anonymously readable and read-only.

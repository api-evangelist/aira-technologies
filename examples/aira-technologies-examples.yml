- name: Page-size ceiling
  operation: listPosts
  spec: openapi/aira-technologies-posts-api-openapi.yml
  request: 'GET /wp/v2/posts?per_page=500'
  http_status: 400
  response: '{"code":"rest_invalid_param","message":"Invalid parameter(s): per_page","data":{"status":400,"params":{"per_page":"per_page must be between 1 (inclusive) and 100 (inclusive)"}}}'
  note: The only hard documented bound on this surface. It is a page-size limit, not a rate limit.
